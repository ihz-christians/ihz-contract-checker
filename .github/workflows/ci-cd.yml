name: CI / Automated Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================================
  # JOB 1: Test Backend (Java 21 / Spring Boot / Postgres RLS)
  # ==============================================================================
  test-backend:
    name: Test Backend (Spring Boot & RLS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Postgres for RLS Tests
        run: |
          docker run --name b2c_test_db -p 5433:5432 -e POSTGRES_PASSWORD=admin -d postgres:15-alpine
          until docker exec b2c_test_db pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done
          docker exec b2c_test_db psql -U postgres -c "CREATE DATABASE testdb;"
          docker exec b2c_test_db psql -U postgres -d testdb -c "CREATE USER app_user WITH PASSWORD 'password';"
          docker exec b2c_test_db psql -U postgres -d testdb -c "GRANT ALL PRIVILEGES ON DATABASE testdb TO app_user;"
          docker exec b2c_test_db psql -U postgres -d testdb -c "ALTER SCHEMA public OWNER TO app_user;"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Backend Tests
        run: |
          cd 02_b2c-contractchecker-spring
          ./mvnw test

  # ==============================================================================
  # JOB 2: Test AI Gateway (Python / FastAPI / Pytest)
  # ==============================================================================
  test-aigateway:
    name: Test AI Gateway (Python & Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies and Run Pytest
        run: |
          cd 03_b2c-ai-gateway
          uv sync
          uv run --package b2c-ai-gateway pytest

  # ==============================================================================
  # JOB 3: Verify Container Builds (Multi-Stage Dockerfile)
  # ==============================================================================
  verify-containers:
    name: Verify Container Builds (Dry-Run)
    needs: [test-backend, test-aigateway]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-backend

      - name: Build AI Gateway Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: aigateway
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-aigateway

      - name: Build Ops Control Center Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: opscontrol
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-opscontrol

  # ==============================================================================
  # JOB 4: Lint Kubernetes / Helm Manifests (IaC Quality)
  # ==============================================================================
  lint-helm:
    name: Lint Kubernetes & Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: |
          helm lint ./helm/b2c-platform

  # ==============================================================================
  # JOB 5: Pipeline Gate (Guaranteed Green Badge)
  # ==============================================================================
  ci-status:
    name: CI Pipeline Status
    needs: [test-backend, test-aigateway, verify-containers, lint-helm]
    runs-on: ubuntu-latest
    steps:
      - name: Quality Gate Summary
        run: |
          echo "=================================================================="
          echo "✅ All Automated Quality Gates Passed Successfully!"
          echo "- Backend Spring Boot Unit- & RLS-Integrationstests: OK"
          echo "- Python AI Gateway Unit- & Schema-Tests: OK"
          echo "- Multi-Stage Docker Container Builds (All Targets): OK"
          echo "- Kubernetes / Helm Infrastructure-as-Code Linting: OK"
          echo "=================================================================="
