name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  REGISTRY: europe-west1-docker.pkg.dev
  IMAGE_BACKEND: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/b2c-repo/backend
  IMAGE_AIGATEWAY: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/b2c-repo/aigateway
  IMAGE_OPSCONTROL: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/b2c-repo/opscontrol

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        
      # Führt exakt eure lokale Nix-Umgebung aus! (Inkl. korrektem headless Java 21)
      - name: Run Tests via Nix
        working-directory: ./01_b2c_module
        run: nix develop --command bash -c "cd 02_b2c-contractchecker-spring && ./mvnw test"

  test-aigateway:
    name: Test AI Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        
      # Nutzt exakt Python 3.11 und das uv aus der flake.nix
      - name: Install and Run Tests via Nix
        working-directory: ./01_b2c_module
        run: nix develop --command bash -c "cd 03_b2c-ai-gateway && uv sync && uv run --package b2c-ai-gateway pytest"

  build-and-push:
    name: Build & Push Images
    needs: [test-backend, test-aigateway]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for requesting the JWT for Workload Identity Federation (WIF)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          # Secure passwordless login using Workload Identity Federation (WIF)
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}'
          
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:${{ github.sha }},${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-backend

      - name: Build & Push AI Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: aigateway
          push: true
          tags: ${{ env.IMAGE_AIGATEWAY }}:${{ github.sha }},${{ env.IMAGE_AIGATEWAY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-aigateway

      - name: Build & Push Ops Control Center
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: opscontrol
          push: true
          tags: ${{ env.IMAGE_OPSCONTROL }}:${{ github.sha }},${{ env.IMAGE_OPSCONTROL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-opscontrol

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write # Required for requesting JWT for WIF
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          # Secure passwordless login using Workload Identity Federation (WIF)
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy to GKE
        run: |
          helm upgrade --install b2c-platform ./helm/b2c-platform \
            --namespace staging --create-namespace \
            -f ./helm/b2c-platform/values-staging.yaml \
            --set global.projectId=${{ secrets.GCP_PROJECT_ID }} \
            --set frontend.image.repository=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/b2c-repo/frontend \
            --set backend.image.repository=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/b2c-repo/backend \
            --set aigateway.image.repository=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/b2c-repo/aigateway \
            --set opscontrol.image.repository=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/b2c-repo/opscontrol \
            --set backend.image.tag=${{ github.sha }} \
            --set aigateway.image.tag=${{ github.sha }} \
            --set opscontrol.image.tag=${{ github.sha }}

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # Required for requesting JWT for WIF
    # Requires manual trigger from GitHub UI (Environment approval)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          # Secure passwordless login using Workload Identity Federation (WIF)
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy to GKE
        run: |
          helm upgrade --install b2c-platform ./helm/b2c-platform \
            --namespace production --create-namespace \
            -f ./helm/b2c-platform/values-production.yaml \
            --set global.projectId=${{ secrets.GCP_PROJECT_ID }} \
            --set frontend.image.repository=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/b2c-repo/frontend \
            --set backend.image.repository=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/b2c-repo/backend \
            --set aigateway.image.repository=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/b2c-repo/aigateway \
            --set opscontrol.image.repository=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/b2c-repo/opscontrol \
            --set backend.image.tag=${{ github.sha }} \
            --set aigateway.image.tag=${{ github.sha }} \
            --set opscontrol.image.tag=${{ github.sha }}
