replicaCount: 2

image:
  repository: europe-west1-docker.pkg.dev/YOUR_PROJECT_ID/b2c-repo/contractchecker
  pullPolicy: IfNotPresent
  tag: "latest" # Dies wird von GitHub Actions beim Deploy überschrieben

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1024Mi"

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  # Diese Werte könnten über K8s Secrets anstelle von Klartext kommen
  - name: GCP_PROJECT_ID
    value: "ihrezuhauseberatung-prod"
  - name: GEMINI_API_KEY
    value: "YOUR_GEMINI_API_KEY"
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://postgres-service:5432/customerai"
  - name: SPRING_DATASOURCE_USERNAME
    value: "postgres"
  - name: SPRING_DATASOURCE_PASSWORD
    value: "securepassword"
