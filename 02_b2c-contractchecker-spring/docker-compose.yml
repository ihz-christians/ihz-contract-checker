version: '3.8'

services:
  # Dedicated database service for the Java Spring Boot Contract Checker
  db:
    image: postgres:15-alpine
    container_name: cc_spring_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customerai
    volumes:
      - cc_spring_pg_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customerai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO - Local S3 Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: cc_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000" # API Port (Hier kommunizieren Java und Python)
      - "9001:9001" # Web UI Console Port
    volumes:
      - cc_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Automatischer Setup-Container: Legt den Bucket "b2c-contracts" direkt beim Start an
  minio-createbucket:
    image: minio/mc:latest
    container_name: cc_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/b2c-contracts --ignore-existing;
      /usr/bin/mc anonymous set private myminio/b2c-contracts;
      exit 0;
      "

volumes:
  cc_spring_pg_data:
    driver: local
  cc_minio_data:
    driver: local
