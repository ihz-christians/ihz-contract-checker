version: '3.8'

services:
  # Dedicated database service for the Java Spring Boot Contract Checker
  db:
    image: postgres:15-alpine
    container_name: cc_spring_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customerai
    volumes:
      - cc_spring_pg_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customerai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Python FastAPI AI Gateway (Dockerized)
  aigateway:
    build:
      context: ../03_b2c-ai-gateway
      dockerfile: Dockerfile
    container_name: cc_ai_gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # GCS Production environment variables (overridden by docker-compose.dev.yml locally)
      - AWS_ACCESS_KEY_ID=${GCP_STORAGE_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${GCP_STORAGE_SECRET_ACCESS_KEY}
      - S3_ENDPOINT_URL=https://storage.googleapis.com

volumes:
  cc_spring_pg_data:
    driver: local

