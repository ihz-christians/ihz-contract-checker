spring:
  application:
    name: contractchecker-java-spring

  mail:
    host: ${SMTP_HOST:smtp.example.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/customerai}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # This URI will dynamically download Google's JWKs to verify Firebase JWT signatures.
          issuer-uri: https://securetoken.google.com/ihrezuhauseberatung-b2c

  lifecycle:
    timeout-per-shutdown-phase: 30s

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

management:
  server:
    port: 8081 # Expose actuator on a different internal port so it's not reachable via main 8080 ingress
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

ihz:
  auth:
    provider: firebase # Options: "firebase", "keycloak". Controls the IdentityProviderAdapter.

llm:
  provider: gemini
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.1-flash-lite
    base-url: https://generativelanguage.googleapis.com/v1beta/models/

# =========================================================
# EMAIL & EXPORT CONFIGURATION
# =========================================================
app:
  mail:
    # "mock" logs to console, "smtp" uses spring.mail config below
    provider: ${MAIL_PROVIDER:mock}

# Standard-Speichereinstellungen
cloud:
  storage:
    bucket-name: ${STORAGE_BUCKET_NAME:b2c-contracts}

# =========================================================
# PROFILE: DEV (Lokale Entwicklung mit MinIO)
# =========================================================
---
spring:
  config:
    activate:
      on-profile: dev

cloud:
  storage:
    type: s3
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin123}
      region: ${S3_REGION:eu-central-1}
      path-style-access: true # Wichtig für MinIO!

# =========================================================
# PROFILE: PROD / STAGE (Google Cloud Storage)
# =========================================================
---
spring:
  config:
    activate:
      on-profile: prod,stage

cloud:
  storage:
    type: gcs
    gcp:
      project-id: ${GCP_PROJECT_ID:ihrezuhauseberatung-prod}

logging:
  level:
    root: INFO
    de.ihrezuhauseberatung.contractchecker: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
