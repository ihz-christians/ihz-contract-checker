<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IhreZuhauseBeratung - Registrierung</title>
    
    <!-- Link to the identical design system CSS variables from React -->
    <link rel="stylesheet" href="/css/style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Exact 1:1 translation of the React tailwind.config.ts design variables
        tailwind.config = {
            darkMode: ["class"],
            theme: {
                extend: {
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        primary: {
                          DEFAULT: "hsl(var(--primary))",
                          foreground: "hsl(var(--primary-foreground))",
                          hover: "hsl(var(--primary-hover))",
                        },
                        secondary: {
                          DEFAULT: "hsl(var(--secondary))",
                          foreground: "hsl(var(--secondary-foreground))",
                        },
                        muted: {
                          DEFAULT: "hsl(var(--muted))",
                          foreground: "hsl(var(--muted-foreground))",
                        },
                        accent: {
                          DEFAULT: "hsl(var(--accent))",
                          foreground: "hsl(var(--accent-foreground))",
                          primary: "hsl(var(--accent-primary))",
                          secondary: "hsl(var(--accent-secondary))",
                        },
                        card: {
                          DEFAULT: "hsl(var(--card))",
                          foreground: "hsl(var(--card-foreground))",
                          hover: "hsl(var(--card-hover))",
                        },
                        destructive: {
                          DEFAULT: "hsl(var(--destructive))",
                          foreground: "hsl(var(--destructive-foreground))",
                        }
                    },
                    boxShadow: {
                        card: "var(--shadow-md)",
                        "card-hover": "var(--shadow-xl)",
                    },
                    borderRadius: {
                        xl: "var(--radius-xl)",
                        "2xl": "var(--radius-2xl)",
                        "3xl": "var(--radius-3xl)",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">
    <main class="flex-1 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <a href="/" class="inline-flex justify-center items-center gap-2.5 text-2xl font-bold tracking-tight text-slate-900 group">
            <img src="/images/white-logo.png" alt="IhreZuhauseBeratung Logo" class="w-10 h-10 transition-transform group-hover:scale-105" onerror="this.src='/images/logo.png'; this.onerror=null;">
            <span class="text-xl font-bold bg-gradient-to-r from-primary to-accent-primary bg-clip-text text-transparent">IhreZuhauseBeratung</span>
        </a>
        <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-900 tracking-tight">
            Erstellen Sie Ihr Konto
        </h2>
        <p class="mt-2 text-center text-sm text-slate-600">
            Oder
            <a href="/login" class="font-bold text-primary hover:text-primary-hover transition-colors">
                melden Sie sich mit Ihrem bestehenden Konto an
            </a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-2xl sm:px-10 border border-slate-200">
            <!-- Error Alert -->
            <div th:if="${error}" class="mb-4 bg-red-50 border border-red-200 rounded-lg p-4 text-sm text-red-800" th:text="${error}">
                Fehler bei der Registrierung.
            </div>

            <form th:action="@{/register}" method="POST" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="firstName" class="block text-sm font-semibold text-slate-700">
                            Vorname
                        </label>
                        <div class="mt-1">
                            <input id="firstName" name="firstName" type="text" required
                                   class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="lastName" class="block text-sm font-semibold text-slate-700">
                            Nachname
                        </label>
                        <div class="mt-1">
                            <input id="lastName" name="lastName" type="text" required
                                   class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                        </div>
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700">
                        E-Mail-Adresse
                    </label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" required autocomplete="email"
                               class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700">
                        Passwort
                    </label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required autocomplete="new-password"
                               class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                    </div>
                </div>

                <div class="flex items-center">
                    <input id="terms" name="terms" type="checkbox" required checked
                           class="h-4 w-4 text-primary focus:ring-primary border-slate-300 rounded">
                    <label for="terms" class="ml-2 block text-sm text-slate-900">
                        Ich stimme den <a href="#" class="text-primary hover:underline">Nutzungsbedingungen</a> und <a href="#" class="text-primary hover:underline">Datenschutzrichtlinien</a> zu.
                    </label>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-primary hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all">
                        Konto erstellen
                    </button>
                </div>
            </form>
        </div>
    </div>
    </main>

    <footer class="bg-slate-50 border-t border-slate-200 mt-auto py-6">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-slate-500 font-medium tracking-wide uppercase">
            <p>&copy; <span th:text="${#calendars.year(#calendars.createNow())}">2026</span> IhreZuhauseBeratung GmbH. Alle Rechte vorbehalten.</p>
            <div class="flex gap-4">
                <a href="/impressum" class="hover:text-slate-800 transition-colors">Impressum</a>
                <a href="/datenschutz" class="hover:text-slate-800 transition-colors">Datenschutz</a>
            </div>
        </div>
    </footer>
</body>
</html>
