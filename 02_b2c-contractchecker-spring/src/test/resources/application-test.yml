spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/testdb
    driver-class-name: org.postgresql.Driver
    username: app_user
    password: password
    hikari:
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false
    url: jdbc:postgresql://localhost:5433/testdb
    user: app_user
    password: password
    init-sqls: "SET app.current_tenant_id = '11111111-1111-1111-1111-111111111111'; SET app.bypass_rls = 'true'"

ihz:
  auth:
    provider: firebase

app:
  webhooks:
    secret: my-super-secret-token

ops:
  control:
    secret: super-secure-ops-token-2026

ai:
  gateway:
    internal-secret: ai-internal-secret-test

