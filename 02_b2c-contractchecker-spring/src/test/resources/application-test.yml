spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/testdb
    driver-class-name: org.postgresql.Driver
    username: app_user
    password: password
    hikari:
      maximum-pool-size: 5

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false
    url: jdbc:postgresql://localhost:5433/testdb
    user: app_user
    password: password

ihz:
  auth:
    provider: firebase
