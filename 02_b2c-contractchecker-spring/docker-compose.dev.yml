version: '3.8'

services:
  # MinIO - Local S3 Compatible Object Storage (Only for Dev)
  minio:
    image: minio/minio:latest
    container_name: cc_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web UI Console Port
    volumes:
      - cc_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Automatischer Setup-Container: Legt den Bucket "b2c-contracts" direkt beim Start an
  minio-setup:
    image: minio/mc:latest
    container_name: cc_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/b2c-contracts --ignore-existing;
      /usr/bin/mc anonymous set private myminio/b2c-contracts;
      exit 0;
      "

  # Override AI Gateway to connect to local MinIO instead of GCS in development
  aigateway:
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      minio:
        condition: service_healthy

volumes:
  cc_minio_data:
    driver: local
