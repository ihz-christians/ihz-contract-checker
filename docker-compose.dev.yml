services:
  # Map database port 5434 locally to avoid host conflicts
  db:
    ports:
      - "5434:5432"

  # MinIO - Local S3 Compatible Object Storage (Only for Local Dev)
  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: cc_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web UI Console Port
    volumes:
      - cc_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auto-setup for local development S3 bucket
  minio-setup:
    image: ghcr.io/coollabsio/minio:latest
    container_name: cc_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/b2c-contracts --ignore-existing;
      /usr/bin/mc anonymous set private myminio/b2c-contracts;
      exit 0;
      "

  # Local development overrides for AI Gateway
  aigateway:
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      minio:
        condition: service_healthy

volumes:
  cc_minio_data:
    driver: local
