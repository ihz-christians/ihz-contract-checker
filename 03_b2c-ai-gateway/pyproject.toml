[project]
name = "b2c-ai-gateway"
version = "1.2.0"
description = "FastAPI AI & Data Gateway for B2C Contract Checker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140.0",
    "uvicorn>=0.51.0",
    "pydantic>=2.13.0",
    "httpx>=0.28.0",
    "google-genai>=2.14.0",
    "instructor>=1.15.0",
    "pymupdf>=1.28.0",
    "docling>=2.115.0",
    "boto3>=1.43.0",
    "python-dotenv>=1.0.1",
    "langfuse>=4.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "faker>=40.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
