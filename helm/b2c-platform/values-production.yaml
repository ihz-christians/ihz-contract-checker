global:
  environment: production
  domain: ihrezuhauseberatung.de

backend:
  replicaCount: 1
  autoscaling:
    enabled: false
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: "prod"

aigateway:
  replicaCount: 1
  autoscaling:
    enabled: false

ingress:
  hosts:
    - host: ihrezuhauseberatung.de
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 8080
        - path: /ai
          pathType: Prefix
          backend:
            service:
              name: aigateway
              port:
                number: 8000
    - host: ops.ihrezuhauseberatung.de
      paths:
        - path: /api/admin
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 8080
        - path: /api/v1
          pathType: Prefix
          backend:
            service:
              name: aigateway
              port:
                number: 8000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 8090
  tls:
    - secretName: b2c-platform-tls
      hosts:
        - ihrezuhauseberatung.de
        - ops.ihrezuhauseberatung.de
