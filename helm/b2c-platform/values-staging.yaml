global:
  environment: staging
  domain: 34.140.239.3.nip.io

ingress:
  hosts:
    - host: 34.140.239.3.nip.io
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 8080
        - path: /ai
          pathType: Prefix
          backend:
            service:
              name: aigateway
              port:
                number: 8000
    - host: ops.34.140.239.3.nip.io
      paths:
        - path: /api/admin
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 8080
        - path: /api/v1
          pathType: Prefix
          backend:
            service:
              name: aigateway
              port:
                number: 8000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 8090
  tls:
    - secretName: b2c-platform-tls
      hosts:
        - 34.140.239.3.nip.io
        - ops.34.140.239.3.nip.io
