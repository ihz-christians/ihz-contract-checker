apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname
      containers:
        # Container A: Java Spring Boot App
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
          ports:
            - containerPort: 8080
            - containerPort: 8081
              name: management
          env:
            {{- toYaml .Values.backend.env | nindent 12 }}
            - name: SPRING_DATASOURCE_URL
              # Verbindet sich physisch sicher über localhost an das Postgres-Sidecar im selben Pod!
              value: "jdbc:postgresql://localhost:5432/customerai"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: password
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 10

        # Container B: PostgreSQL Database Sidecar (Komplett intern abgesichert!)
        - name: db-sidecar
          image: postgres:15-alpine
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: customerai
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/db-password/password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pg-db-data
              mountPath: /var/lib/postgresql/data
            - name: db-password-secret
              mountPath: /run/secrets/db-password
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi

        # Container C: Ops Control PWA Sidecar (Nur über VPN-Ingress erreichbar!)
        - name: opscontrol-sidecar
          image: "{{ .Values.opscontrol.image.repository }}:{{ .Values.opscontrol.image.tag }}"
          imagePullPolicy: {{ .Values.opscontrol.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
          ports:
            - containerPort: 8090
          resources:
            {{- toYaml .Values.opscontrol.resources | nindent 12 }}

      # Shared Pod Storage and Secrets Configuration
      volumes:
        - name: pg-db-data
          persistentVolumeClaim:
            claimName: backend-postgres-pvc
        - name: db-password-secret
          secret:
            secretName: db-secrets
            items:
              - key: password
                path: password
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: web
      port: {{ .Values.backend.service.port }}
      targetPort: 8080
      protocol: TCP
    - name: opscontrol
      port: 8090
      targetPort: 8090
      protocol: TCP
  selector:
    app: backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  annotations:
    iam.gke.io/gcp-service-account: "b2c-app-sa@{{ .Values.global.projectId }}.iam.gserviceaccount.com"

