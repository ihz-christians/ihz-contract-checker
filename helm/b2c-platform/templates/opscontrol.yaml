apiVersion: apps/v1
kind: Deployment
metadata:
  name: opscontrol
  labels:
    app: opscontrol
spec:
  replicas: {{ .Values.opscontrol.replicaCount }}
  selector:
    matchLabels:
      app: opscontrol
  template:
    metadata:
      labels:
        app: opscontrol
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - opscontrol
              topologyKey: kubernetes.io/hostname
      containers:
        - name: opscontrol
          image: "{{ .Values.opscontrol.image.repository }}:{{ .Values.opscontrol.image.tag }}"
          imagePullPolicy: {{ .Values.opscontrol.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101 # nginx user
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.opscontrol.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: opscontrol
  annotations:
    cloud.google.com/backend-config: '{"default": "iap-backendconfig"}'
spec:
  type: {{ .Values.opscontrol.service.type }}
  ports:
    - port: {{ .Values.opscontrol.service.port }}
      targetPort: 8080
      protocol: TCP
  selector:
    app: opscontrol
---
{{- if .Values.opscontrol.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opscontrol
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opscontrol
  minReplicas: {{ .Values.opscontrol.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.opscontrol.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.opscontrol.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opscontrol-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: opscontrol
